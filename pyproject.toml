[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagents"
version = "0.1.0"
description = "Phase 0 evaluation assets for the VoiceAgents phone-channel MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["voiceagents*"]
