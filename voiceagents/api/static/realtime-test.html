<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoiceAgents Realtime Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        gap: 16px;
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px;
      }

      header,
      section {
        background: #ffffff;
        border: 1px solid #d9e0ec;
        border-radius: 8px;
        padding: 16px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 16px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      select {
        min-height: 36px;
        border: 1px solid #aab5c8;
        border-radius: 6px;
        background: #ffffff;
        color: #172033;
        padding: 0 12px;
        font-size: 14px;
      }

      button {
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      [data-panel] {
        min-height: 96px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .handoff {
        border-color: #d48b20;
        background: #fff8ed;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VoiceAgents Realtime Test</h1>
        <div class="toolbar">
          <button id="start-session" type="button">Start</button>
          <button id="stop-session" type="button">Stop</button>
          <button id="mute-toggle" type="button">Mute</button>
          <select id="response-mode" aria-label="Response mode">
            <option value="text">Text</option>
            <option value="voice">Voice</option>
          </select>
        </div>
      </header>

      <div class="grid">
        <section>
          <h2>Session State</h2>
          <div id="session-state" data-panel>idle</div>
        </section>
        <section>
          <h2>Transcript</h2>
          <div id="transcript" data-panel></div>
        </section>
        <section>
          <h2>Assistant Response</h2>
          <div id="assistant-response" data-panel></div>
        </section>
        <section>
          <h2>Tool Calls</h2>
          <div id="tool-calls" data-panel></div>
        </section>
        <section class="handoff">
          <h2>Handoff</h2>
          <div id="handoff-state" data-panel>none</div>
        </section>
        <section>
          <h2>Latency</h2>
          <div id="latency" data-panel></div>
        </section>
        <section>
          <h2>Provider Events</h2>
          <div id="provider-events" data-panel></div>
        </section>
      </div>
    </main>
  </body>
</html>
